name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release/camunda-mcp
          cp index.js menu.js package.json README.md LICENSE release/camunda-mcp/
          cp -r dist release/camunda-mcp/
          mkdir -p release/camunda-mcp/client/dist
          cp client/dist/client.js release/camunda-mcp/client/dist/
          cp -r docs release/camunda-mcp/ 2>/dev/null || true
          cd release/camunda-mcp && npm install --omit=dev --ignore-scripts
          cd .. && zip -qr "camunda-mcp-${REF_NAME}.zip" camunda-mcp/
          tar -czf "camunda-mcp-${REF_NAME}.tar.gz" camunda-mcp/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/camunda-mcp-${{ github.ref_name }}.zip
            release/camunda-mcp-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
