name: Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch: {}

# Same dedup as ci.yml: a push to a branch with an open PR fires both `push` and
# `pull_request:synchronize` for the same commit. Group by the branch's head SHA
# (not github.sha, which is a synthetic merge commit on pull_request events) so
# the second run cancels the first instead of scanning the same commit twice.
concurrency:
  group: security-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (dependencies + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan (npm deps + secrets)
        uses: aquasecurity/trivy-action@0.36.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error
